[project]
name = "complaint-taxonomy"
version = "0.2.0"
description = "Cluster bilingual (Chinese/English) complaint conversation logs into complaint categories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
# Real multilingual embeddings on CPU via ONNX, no torch.  -> uv sync --extra embed
embed = [
    "fastembed>=0.3",
]
# Only needed if you want to swap the ONNX embedder for sentence-transformers
# or do GPU work.  -> uv sync --extra torch
# Pinned to the version verified to run on an aarch64 box (CUDA 13.0 wheels,
# manylinux_2_28_aarch64, straight from PyPI -- no extra index needed).
torch = [
    "torch==2.12.1",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
]

# This is a scripts repo, not a distributable package.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B905 (zip strict=) is noise here: every zip pairs lists built side by side.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Fixture data: long Chinese/English sentence literals; wrapping them would
# destroy readability and they are not code.
"data/*" = ["E501"]
